name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Regression tests
        shell: bash
        # Keep the output: a failed step on its own only says "exit code 1", and reading the log of a
        # failed run needs owner credentials. The tail below goes into the summary and the annotation,
        # which are visible on the public run.
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.txt
      - name: Explain a failed test run
        if: failure()
        shell: bash
        run: |
          tail -n 60 test-output.txt > tail.txt || true
          {
            echo '### Regression tests failed. Last 60 lines:'
            echo
            echo '```'
            cat tail.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          escaped=$(sed -e 's/%/%25/g' -e 's/\r//g' tail.txt | tr '\n' ' ')
          echo "::error title=Regression tests failed::${escaped:0:900}"
      - name: Typecheck
        run: npm run typecheck
      - name: Build renderer and main
        run: npm run build
      - name: Electron smoke test
        run: npm run test:smoke
      - name: Draft survives a crash
        run: npm run test:crash
      - name: Context handoff smoke test
        run: npm run test:handoff
      - name: Package installer
        run: npx electron-builder --config electron-builder.yml --win --publish never
      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            release/*.exe \
            release/latest.yml \
            release/*.blockmap \
            --title "Prophey ${GITHUB_REF_NAME}" \
            --generate-notes
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            release/*.exe
            release/latest.yml
            release/*.blockmap
          if-no-files-found: error
      - name: Upload test output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: regression-test-output
          path: test-output.txt
          if-no-files-found: warn

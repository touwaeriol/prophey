name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Regression tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Build renderer and main
        run: npm run build
      - name: Electron smoke test
        run: npm run test:smoke
      - name: Draft survives a crash
        run: npm run test:crash
      - name: Context handoff smoke test
        run: npm run test:handoff
      - name: Package installer
        run: npx electron-builder --config electron-builder.yml --win --publish never
      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            release/*.exe \
            release/latest.yml \
            release/*.blockmap \
            --title "Prophey ${GITHUB_REF_NAME}" \
            --generate-notes
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            release/*.exe
            release/latest.yml
            release/*.blockmap
          if-no-files-found: error
